name: Live Normal Game QA

on:
  push:
    branches:
      - qa-live-normal

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare isolated Playwright runtime
        run: |
          mkdir -p /tmp/liveqa
          cd /tmp/liveqa
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/scripts/live-normal-qa.mjs" ./live-normal-qa.mjs
      - name: Run normal-game multi-browser QA
        run: |
          cd /tmp/liveqa
          node live-normal-qa.mjs
